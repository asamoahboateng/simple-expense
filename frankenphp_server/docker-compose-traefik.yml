services:
  # Init service - runs composer install and migrations before main app starts
  init:
    build:
      context: ..
      dockerfile: ./frankenphp_server/Dockerfile.frankenphp
    container_name: simple-expense_init_franken
    entrypoint: ["/bin/sh", "/app/frankenphp_server/init.sh"]
    volumes:
      - ../:/app
      - vendor_data:/app/vendor
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HOST_DOMAIN=${HOST_DOMAIN:-kalourmade.com}
      - MIGRATION_SECRET=${MIGRATION_SECRET:-singole_OlaKalourmade@SpecialMigration}
    # depends_on:
    #   db:
    #     condition: service_healthy
    #   redis:
    #     condition: service_started
    restart: "no"
    networks:
      - simple-expense_net
      - km_traefik-public

