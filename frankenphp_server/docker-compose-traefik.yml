  frankenphp:
    build:
      context: ..
      dockerfile: ./frankenphp_server/Dockerfile.frankenphp
    restart: unless-stopped
    deploy:
      replicas: ${REPLICAS}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simple-expense_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.simple-expense_app.entrypoints=websecure"
      - "traefik.http.routers.simple-expense_app.tls=true"
      - "traefik.http.routers.simple-expense_app.tls.certresolver=le"
      - "traefik.http.services.simple-expense_app.loadbalancer.server.port=8000"
      - "traefik.docker.network=km_traefik-public"
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_ENV=${APP_ENV:-local}
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - APP_URL=${APP_URL}
      - MAIL_MAILER=smtp
      - MAIL_HOST=email-smtp.us-east-1.amazonaws.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123}
      - HOST_DOMAIN=${HOST_DOMAIN:-kalourmade.com}
      - MIGRATION_SECRET=${MIGRATION_SECRET:-singole_OlaKalourmade@SpecialMigration}
    volumes:
      - ../:/app
      - vendor_data:/app/vendor
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - simple-expense_net
      - km_traefik-public

