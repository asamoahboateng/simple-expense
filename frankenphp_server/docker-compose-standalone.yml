# Standalone FrankenPHP setup (no Traefik required)
# FrankenPHP handles SSL directly via Caddy
services:
  # Init service - runs composer install and migrations before main app starts
  init:
    build:
      context: ..
      dockerfile: ./frankenphp_server/Dockerfile.frankenphp
    container_name: simple-expense_init_franken
    entrypoint: ["/bin/sh", "/app/frankenphp_server/init.sh"]
    volumes:
      - ../:/app
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravelUser
      - DB_PASSWORD=laravel@UserPassword
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis@root
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: "no"
    networks:
      - simple-expense_net

  frankenphp:
    build:
      context: ..
      dockerfile: ./frankenphp_server/Dockerfile.frankenphp
    container_name: simple-expense_frankenphp
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_ENV=local
      - OCTANE_SERVER=frankenphp
      - SERVER_NAME=${APP_DOMAIN}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravelUser
      - DB_PASSWORD=laravel@UserPassword
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis@root
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - APP_URL=${APP_URL}
      - MAIL_MAILER=smtp
      - MAIL_HOST=email-smtp.us-east-1.amazonaws.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_PROTOCOL=http
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123}
    volumes:
      - ../:/app
      - /app/vendor
      - /app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - simple-expense_net

  # Queue worker
  simple-expense_worker:
    build:
      context: ..
      dockerfile: ./frankenphp_server/Dockerfile.frankenphp
    container_name: simple-expense_worker_franken
    restart: unless-stopped
    entrypoint: ["php"]
    command:
      [
        "artisan",
        "queue:work",
        "--queue=default",
        "--sleep=3",
        "--tries=3",
        "--max-jobs=1000",
      ]
    volumes:
      - ../:/app
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=laravelUser
      - DB_PASSWORD=laravel@UserPassword
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis@root
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=email-smtp.us-east-1.amazonaws.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
    depends_on:
      frankenphp:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - simple-expense_net

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: simple-expense_db_franken
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravelUser
      POSTGRES_PASSWORD: laravel@UserPassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravelUser -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    volumes:
      - ./pgsql-data:/var/lib/postgresql/data
    networks:
      - simple-expense_net

  # Weekly database backup - deletes old backup and creates a fresh pg_dump
  db_backup:
    image: postgres:16-alpine
    container_name: simple-expense_backup_franken
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[$(date)] Starting weekly backup..."
          rm -f /backups/*.sql.gz
          PGPASSWORD=laravel@UserPassword pg_dump -h db -U laravelUser -d laravel | gzip > /backups/backup_$(date +%Y%m%d_%H%M%S).sql.gz
          echo "[$(date)] Backup complete. Next backup in 7 days."
          sleep 604800
        done
    environment:
      PGPASSWORD: laravel@UserPassword
    volumes:
      - ./db-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simple-expense_net

  # Adminer for database management
  adminer:
    image: adminer
    container_name: simple-expense_adminer_franken
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    networks:
      - simple-expense_net

  # Redis cache
  redis:
    image: redis:alpine
    container_name: simple-expense_redis_franken
    restart: unless-stopped
    command: redis-server --requirepass redis@root
    networks:
      - simple-expense_net

  # Typesense search engine
  typesense:
    image: typesense/typesense:27.1
    container_name: simple-expense_typesense_franken
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz123}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - ./typesense-data:/data
    ports:
      - "8108:8108"
    networks:
      - simple-expense_net

networks:
  simple-expense_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
